  <rect x="96" y="304" width="116" height="24" rx="12" fill="#94a3b8" opacity="0.55" />
  <rect x="96" y="352" width="144" height="24" rx="12" fill="#94a3b8" opacity="0.35" />

  <!-- Ondas de voz neural (lado direito) -->
  <rect x="308" y="208" width="22" height="96" rx="11" fill="url(#ondaCiano)" />
  <rect x="350" y="152" width="22" height="208" rx="11" fill="url(#ondaCiano)" />
  <rect x="392" y="184" width="22" height="144" rx="11" fill="url(#destaqueOuro)" />
